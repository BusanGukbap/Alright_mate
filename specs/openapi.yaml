openapi: 3.1.0
info:
  title: Alright, Mate? API
  version: 1.0.0
  description: API contract for the single-owner British English expression journal.
servers:
  - url: /
    description: Same-origin deployment gateway.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process liveness
      security: []
      responses:
        '200':
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadiness
      summary: Check dependency readiness
      security: []
      responses:
        '200':
          description: Service is ready to receive traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ProblemServiceUnavailable'
  /api/v1/expressions:
    get:
      operationId: listPublicExpressions
      summary: List published expressions
      security: []
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/TagQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Published expressions only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicExpressionPage'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
  /api/v1/expressions/{id}:
    get:
      operationId: getPublicExpression
      summary: Get one published expression
      security: []
      parameters:
        - $ref: '#/components/parameters/ExpressionId'
      responses:
        '200':
          description: Published expression.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicExpression'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
  /api/v1/admin/expressions:
    post:
      operationId: createExpression
      summary: Create an owner expression through the trusted gateway
      description: The gateway validates the oauth2-proxy HttpOnly session, strips inbound identity headers and injects its internal owner identity assertion on the private API hop. The assertion is not a caller-supplied security scheme or parameter.
      security:
        - ownerGatewaySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpressionRequest'
      responses:
        '201':
          description: Expression created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExpression'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorised'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '409':
          $ref: '#/components/responses/ProblemConflict'
        '422':
          $ref: '#/components/responses/ProblemUnprocessable'
  /api/v1/admin/expressions/{id}:
    patch:
      operationId: updateExpression
      summary: Update, publish or archive an owner expression through the trusted gateway
      description: The gateway validates the oauth2-proxy HttpOnly session, strips inbound identity headers and injects its internal owner identity assertion on the private API hop. The assertion is not a caller-supplied security scheme or parameter. Invalid lifecycle transitions and all amendments to an archived expression return 422.
      security:
        - ownerGatewaySession: []
      parameters:
        - $ref: '#/components/parameters/ExpressionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpressionRequest'
      responses:
        '200':
          description: Expression updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExpression'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorised'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '409':
          $ref: '#/components/responses/ProblemConflict'
        '422':
          $ref: '#/components/responses/ProblemUnprocessable'
  /api/v1/admin/reviews/due:
    get:
      operationId: listDueReviews
      summary: List published expressions due for review through the trusted gateway
      description: The gateway validates the oauth2-proxy HttpOnly session, strips inbound identity headers and injects its internal owner identity assertion on the private API hop. The assertion is not a caller-supplied security scheme or parameter.
      security:
        - ownerGatewaySession: []
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Due review entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DueReviewPage'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorised'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
  /api/v1/admin/review-events:
    post:
      operationId: recordReviewEvent
      summary: Record one review rating and advance state through the trusted gateway
      description: The gateway validates the oauth2-proxy HttpOnly session, strips inbound identity headers and injects its internal owner identity assertion on the private API hop. The assertion is not a caller-supplied security scheme or parameter.
      security:
        - ownerGatewaySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewEventRequest'
      responses:
        '201':
          description: Review event recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEventResult'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorised'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '409':
          description: A review is already recorded for this expression on this Asia/Seoul date.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:alright-mate:problem:review-already-recorded
                title: Review already recorded
                status: 409
                detail: A review already exists for this expression today in Asia/Seoul.
        '422':
          $ref: '#/components/responses/ProblemUnprocessable'
  /api/v1/admin/progress:
    get:
      operationId: getReviewProgress
      summary: Get owner review progress by Asia/Seoul date through the trusted gateway
      description: The gateway validates the oauth2-proxy HttpOnly session, strips inbound identity headers and injects its internal owner identity assertion on the private API hop. The assertion is not a caller-supplied security scheme or parameter.
      security:
        - ownerGatewaySession: []
      parameters:
        - $ref: '#/components/parameters/DaysQuery'
      responses:
        '200':
          description: Inclusive daily review progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewProgress'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorised'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
components:
  securitySchemes:
    ownerGatewaySession:
      type: apiKey
      in: cookie
      name: _oauth2_proxy
      description: Gateway-managed oauth2-proxy HttpOnly browser session cookie. It is validated at the gateway and is not an internal identity assertion or an API key supplied by API clients.
  x-internal-gateway-contract:
    trustedOwnerIdentity: The gateway strips all client identity headers and injects the configured owner's identity only on its private API hop. This assertion is deliberately not a security scheme or request parameter in the public API contract.
  parameters:
    ExpressionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
    TagQuery:
      name: tag
      in: query
      schema:
        $ref: '#/components/schemas/Tag'
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DaysQuery:
      name: days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 90
        default: 30
  responses:
    ProblemBadRequest:
      description: Request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemUnauthorised:
      description: Owner authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemForbidden:
      description: Authenticated identity is not the configured owner.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemNotFound:
      description: Resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemConflict:
      description: Request conflicts with existing state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemUnprocessable:
      description: Request is syntactically valid but violates a business rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemServiceUnavailable:
      description: Required dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Rating:
      type: string
      enum: [again, good]
    IntervalDays:
      type: integer
      enum: [1, 3, 7, 14, 30]
    Tag:
      type: string
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$'
    SourceUrl:
      type: string
      format: uri
      pattern: '^https?://'
      maxLength: 2048
    ExpressionText:
      type: string
      minLength: 1
      maxLength: 300
    KoreanMeaning:
      type: string
      minLength: 1
      maxLength: 1000
    PublicNote:
      type: string
      maxLength: 4000
    NullablePublicNote:
      oneOf:
        - $ref: '#/components/schemas/PublicNote'
        - type: 'null'
    Tags:
      type: array
      maxItems: 20
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Tag'
    NullableSourceUrl:
      oneOf:
        - $ref: '#/components/schemas/SourceUrl'
        - type: 'null'
    PublicExpression:
      type: object
      additionalProperties: false
      required: [id, expression, meaningKo, tags, sourceUrl, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        expression:
          $ref: '#/components/schemas/ExpressionText'
        meaningKo:
          $ref: '#/components/schemas/KoreanMeaning'
        note:
          $ref: '#/components/schemas/PublicNote'
        tags:
          $ref: '#/components/schemas/Tags'
        sourceUrl:
          $ref: '#/components/schemas/SourceUrl'
        publishedAt:
          type: string
          format: date-time
          description: UTC instant.
    PublicExpressionPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicExpressionListItem'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          minimum: 0
    PublicExpressionListItem:
      type: object
      additionalProperties: false
      required: [id, expression, meaningKo, tags, sourceUrl, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        expression:
          $ref: '#/components/schemas/ExpressionText'
        meaningKo:
          $ref: '#/components/schemas/KoreanMeaning'
        tags:
          $ref: '#/components/schemas/Tags'
        sourceUrl:
          $ref: '#/components/schemas/SourceUrl'
        publishedAt:
          type: string
          format: date-time
          description: UTC instant.
    CreateExpressionRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateDraftExpressionRequest'
        - $ref: '#/components/schemas/CreatePublishedExpressionRequest'
    CreateDraftExpressionRequest:
      type: object
      additionalProperties: false
      required: [expression, meaningKo]
      properties:
        expression:
          $ref: '#/components/schemas/ExpressionText'
        meaningKo:
          $ref: '#/components/schemas/KoreanMeaning'
        note:
          $ref: '#/components/schemas/PublicNote'
        tags:
          $ref: '#/components/schemas/Tags'
        sourceUrl:
          $ref: '#/components/schemas/SourceUrl'
        status:
          type: string
          const: draft
          default: draft
    CreatePublishedExpressionRequest:
      type: object
      additionalProperties: false
      required: [expression, meaningKo, sourceUrl, status]
      properties:
        expression:
          $ref: '#/components/schemas/ExpressionText'
        meaningKo:
          $ref: '#/components/schemas/KoreanMeaning'
        note:
          $ref: '#/components/schemas/PublicNote'
        tags:
          $ref: '#/components/schemas/Tags'
        sourceUrl:
          $ref: '#/components/schemas/SourceUrl'
        status:
          type: string
          const: published
    UpdateExpressionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        expression:
          $ref: '#/components/schemas/ExpressionText'
        meaningKo:
          $ref: '#/components/schemas/KoreanMeaning'
        note:
          $ref: '#/components/schemas/NullablePublicNote'
        tags:
          $ref: '#/components/schemas/Tags'
        sourceUrl:
          $ref: '#/components/schemas/NullableSourceUrl'
        status:
          type: string
          enum: [published, archived]
          description: The server permits only `draft` to `published` and `published` to `archived`; invalid transitions return 422.
    ReviewState:
      type: object
      additionalProperties: false
      required: [intervalDays, dueAt, updatedAt]
      properties:
        intervalDays:
          $ref: '#/components/schemas/IntervalDays'
        dueAt:
          type: string
          format: date-time
          description: UTC instant.
        lastReviewedAt:
          type: [string, 'null']
          format: date-time
          description: UTC instant when non-null.
        updatedAt:
          type: string
          format: date-time
          description: UTC instant.
    AdminExpression:
      oneOf:
        - $ref: '#/components/schemas/AdminDraftExpression'
        - $ref: '#/components/schemas/AdminPublishedExpression'
        - $ref: '#/components/schemas/AdminArchivedExpression'
      discriminator:
        propertyName: status
        mapping:
          draft: '#/components/schemas/AdminDraftExpression'
          published: '#/components/schemas/AdminPublishedExpression'
          archived: '#/components/schemas/AdminArchivedExpression'
    AdminDraftExpression:
      type: object
      additionalProperties: false
      required: [id, expression, meaningKo, tags, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        expression:
          $ref: '#/components/schemas/ExpressionText'
        meaningKo:
          $ref: '#/components/schemas/KoreanMeaning'
        note:
          $ref: '#/components/schemas/NullablePublicNote'
        tags:
          $ref: '#/components/schemas/Tags'
        sourceUrl:
          $ref: '#/components/schemas/NullableSourceUrl'
        status:
          type: string
          const: draft
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminPublishedExpression:
      type: object
      additionalProperties: false
      required: [id, expression, meaningKo, tags, sourceUrl, status, createdAt, updatedAt, publishedAt, reviewState]
      properties:
        id:
          type: string
          format: uuid
        expression:
          $ref: '#/components/schemas/ExpressionText'
        meaningKo:
          $ref: '#/components/schemas/KoreanMeaning'
        note:
          $ref: '#/components/schemas/NullablePublicNote'
        tags:
          $ref: '#/components/schemas/Tags'
        sourceUrl:
          $ref: '#/components/schemas/SourceUrl'
        status:
          type: string
          const: published
        createdAt:
          type: string
          format: date-time
          description: UTC instant.
        updatedAt:
          type: string
          format: date-time
          description: UTC instant.
        publishedAt:
          type: string
          format: date-time
          description: UTC instant.
        reviewState:
          $ref: '#/components/schemas/ReviewState'
    AdminArchivedExpression:
      type: object
      additionalProperties: false
      required: [id, expression, meaningKo, tags, sourceUrl, status, createdAt, updatedAt, publishedAt, archivedAt, reviewState]
      properties:
        id:
          type: string
          format: uuid
        expression:
          $ref: '#/components/schemas/ExpressionText'
        meaningKo:
          $ref: '#/components/schemas/KoreanMeaning'
        note:
          $ref: '#/components/schemas/NullablePublicNote'
        tags:
          $ref: '#/components/schemas/Tags'
        sourceUrl:
          $ref: '#/components/schemas/SourceUrl'
        status:
          type: string
          const: archived
        createdAt:
          type: string
          format: date-time
          description: UTC instant.
        updatedAt:
          type: string
          format: date-time
          description: UTC instant.
        publishedAt:
          type: string
          format: date-time
          description: UTC instant.
        archivedAt:
          type: string
          format: date-time
          description: UTC instant.
        reviewState:
          $ref: '#/components/schemas/ReviewState'
    DueReviewExpression:
      type: object
      additionalProperties: false
      required: [id, expression, meaningKo, tags, sourceUrl, status, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        expression:
          $ref: '#/components/schemas/ExpressionText'
        meaningKo:
          $ref: '#/components/schemas/KoreanMeaning'
        note:
          $ref: '#/components/schemas/NullablePublicNote'
        tags:
          $ref: '#/components/schemas/Tags'
        sourceUrl:
          $ref: '#/components/schemas/SourceUrl'
        status:
          type: string
          const: published
        publishedAt:
          type: string
          format: date-time
          description: UTC instant.
    DueReview:
      type: object
      additionalProperties: false
      required: [expression, reviewState]
      properties:
        expression:
          $ref: '#/components/schemas/DueReviewExpression'
        reviewState:
          $ref: '#/components/schemas/ReviewState'
    DueReviewPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DueReview'
    CreateReviewEventRequest:
      type: object
      additionalProperties: false
      required: [expressionId, rating]
      properties:
        expressionId:
          type: string
          format: uuid
        rating:
          $ref: '#/components/schemas/Rating'
    ReviewEventResult:
      type: object
      additionalProperties: false
      required: [eventId, expressionId, rating, reviewedAt, reviewDateSeoul, previousIntervalDays, nextIntervalDays, reviewState]
      properties:
        eventId:
          type: string
          format: uuid
        expressionId:
          type: string
          format: uuid
        rating:
          $ref: '#/components/schemas/Rating'
        reviewedAt:
          type: string
          format: date-time
          description: UTC instant assigned by the server.
        reviewDateSeoul:
          type: string
          format: date
          description: Asia/Seoul local date derived by the database.
        previousIntervalDays:
          $ref: '#/components/schemas/IntervalDays'
        nextIntervalDays:
          $ref: '#/components/schemas/IntervalDays'
        reviewState:
          $ref: '#/components/schemas/ReviewState'
    ProgressDay:
      type: object
      additionalProperties: false
      required: [date, total, again, good]
      description: One Asia/Seoul calendar day. `total` equals `again + good`.
      properties:
        date:
          type: string
          format: date
          description: Asia/Seoul local date.
        total:
          type: integer
          minimum: 0
        again:
          type: integer
          minimum: 0
        good:
          type: integer
          minimum: 0
    ReviewProgress:
      type: object
      additionalProperties: false
      required: [days, startDate, endDate, total, entries]
      description: "`entries` is ordered ascending, contains exactly `days` consecutive Asia/Seoul dates from `startDate` through `endDate`, and includes zero-count dates. Response `total` equals the sum of every entry `total`."
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 90
          description: "Exact number of inclusive Asia/Seoul dates represented by `entries`."
        startDate:
          type: string
          format: date
          description: "Earliest inclusive Asia/Seoul local date in `entries`."
        endDate:
          type: string
          format: date
          description: "Latest inclusive Asia/Seoul local date in `entries`."
        total:
          type: integer
          minimum: 0
        entries:
          type: array
          minItems: 1
          maxItems: 90
          items:
            $ref: '#/components/schemas/ProgressDay'
      x-alright-mate-relational-constraints:
        - 'entries.length == days'
        - 'entries[0].date == startDate'
        - 'entries[days - 1].date == endDate'
        - 'entries dates are consecutive Asia/Seoul dates in ascending order'
        - 'total == sum(entries[].total)'
        - 'each entries[].total == entries[].again + entries[].good'
    Problem:
      type: object
      description: RFC 9457 problem detail object.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
