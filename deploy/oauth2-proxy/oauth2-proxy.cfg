provider = "github"
http_address = "0.0.0.0:4180"
upstreams = ["static://202"]
email_domains = ["*"]
proxy_prefix = "/oauth2"

set_xauthrequest = true
reverse_proxy = true
real_client_ip_header = "X-Forwarded-For"

cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_expire = "24h"
cookie_refresh = "1h"

skip_provider_button = true
silence_ping_logging = true
ping_path = "/ping"
ready_path = "/ready"
