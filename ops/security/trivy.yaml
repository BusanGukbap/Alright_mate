exit-code: 1
format: table
ignorefile: ops/security/.trivyignore.yaml
scan:
  scanners:
    - vuln
    - misconfig
    - secret
  # These paths contain only local toolchains/caches, installed dependency
  # trees, compiled output, VCS metadata or disposable browser-test reports.
  # Source, Dockerfiles, IaC, scripts, operational configuration and dependency
  # lockfiles remain in scope. The wrapper mounts the repository at /workspace.
  skip-dirs:
    - /workspace/.Codex
    - /workspace/.git
    - /workspace/.tools
    - "/workspace/**/.terraform"
    - "/workspace/**/dist"
    - "/workspace/**/node_modules"
    - /workspace/playwright-report
    - /workspace/test-results
severity:
  - HIGH
  - CRITICAL
timeout: 2m
vulnerability:
  ignore-unfixed: false
