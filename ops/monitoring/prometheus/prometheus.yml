global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: alright-mate
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: alright-mate-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080

  - job_name: alright-mate-node
    static_configs:
      - targets:
          - node-exporter:9100
