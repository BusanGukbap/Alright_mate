groups:
  - name: alright-mate-recordings
    interval: 30s
    rules:
      - record: job:alright_mate_http_requests:rate5m
        expr: sum(rate(alright_mate_http_requests_total[5m]))

      - record: job:alright_mate_http_5xx:ratio5m
        expr: >-
          sum(rate(alright_mate_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(alright_mate_http_requests_total[5m])), 0.001)

      - record: job:alright_mate_http_request_duration:p95_5m
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(alright_mate_http_request_duration_seconds_bucket[5m])))

  - name: alright-mate-alerts
    rules:
      - alert: AlrightMateUnavailable
        expr: up{job="alright-mate-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Alright Mate API metrics target is unavailable
          description: Prometheus has been unable to scrape the private API target for two minutes.

      - alert: AlrightMateHigh5xxRate
        expr: job:alright_mate_http_5xx:ratio5m > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Alright Mate has an elevated server error ratio
          description: More than five per cent of requests have returned 5xx responses for ten minutes.

      - alert: AlrightMateHighP95Latency
        expr: job:alright_mate_http_request_duration:p95_5m > 0.75
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Alright Mate p95 latency is elevated
          description: Five-minute p95 request latency has exceeded 750 milliseconds for ten minutes.

      - alert: AlrightMateDiskPressure
        expr: >-
          100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Alright Mate host disk space is low
          description: A persistent host filesystem has less than fifteen per cent available space.

      - alert: AlrightMateBackupFailed
        expr: alright_mate_backup_last_run_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The most recent Alright Mate backup failed
          description: Inspect the restricted backup service journal and object-storage health.

      - alert: AlrightMateBackupStale
        expr: >-
          (time() - alright_mate_backup_last_success_timestamp_seconds > 93600)
          or absent(alright_mate_backup_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Alright Mate has no recent successful backup
          description: No successful encrypted backup has been recorded within twenty-six hours.
