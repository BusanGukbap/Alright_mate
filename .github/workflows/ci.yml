name: CI and immutable images

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  contracts:
    name: Contracts and delivery policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/delivery/requirements.txt
      - name: Install delivery policy dependencies
        run: python -m pip install --requirement tests/delivery/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: Validate OpenAPI
        run: npx --yes --package=@redocly/cli@2.43.3 redocly lint specs/openapi.yaml
      - name: Verify generated frontend contract has no drift
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm run generate
          git diff --exit-code -- src/api/schema.d.ts
      - name: Verify generated Go contracts have no drift
        working-directory: apps/api
        run: |
          go generate ./...
          git diff --exit-code -- internal/httpapi/openapi.gen.go internal/storage/sqlc
      - name: Run delivery policy tests
        run: python -m unittest tests.delivery.test_delivery_contract -v
      - name: Validate workflow syntax with pinned actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate delivery shells with pinned ShellCheck
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --volume "$PWD:/workspace:ro" \
            koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            /workspace/scripts/delivery/release.sh \
            /workspace/scripts/delivery/resolve-images.sh \
            /workspace/scripts/delivery/remote-release.sh \
            /workspace/scripts/delivery/scan-images.sh \
            /workspace/scripts/delivery/migration-compatibility.sh \
            /workspace/scripts/delivery/ssh-command.sh \
            /workspace/infra/tests/ansible/verify-delivery-controller.sh

  backend:
    name: Go and real PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: Test against real PostgreSQL
        working-directory: apps/api
        run: REQUIRE_DOCKER=1 go test -mod=readonly ./... -count=1
      - name: Vet and build
        working-directory: apps/api
        run: |
          go vet ./...
          go build ./...

  frontend:
    name: React application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Generate, test and build
        working-directory: apps/web
        run: |
          npm run generate
          npm run test -- --run
          npm run typecheck
          npm run lint
          npm run spellcheck
          npm run build

  runtime:
    name: Compose and gateway runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
      - name: Validate resolved runtime policy
        run: node --test tests/runtime/runtime-config.test.mjs
      - name: Build and probe the real runtime
        run: RUNTIME_DOCKER_TESTS=1 OPENSSL_BIN=/usr/bin/openssl node --test --test-concurrency=1 tests/runtime/docker-runtime.test.mjs

  e2e:
    name: Chromium real-stack journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install locked browser dependencies
        working-directory: tests/e2e
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Typecheck browser journeys
        working-directory: tests/e2e
        run: npm run typecheck
      - name: Run fresh-volume browser journeys
        working-directory: tests/e2e
        run: npm test
      - name: Retain first-retry browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  infra:
    name: OpenTofu and Ansible
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infra/ansible/requirements.txt
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.1
          tofu_wrapper: false
      - name: Run infrastructure contract tests
        run: |
          python -m unittest infra.tests.test_infra_contract -v
          python -m unittest infra.tests.test_resolved_production_compose -v
      - name: Validate OpenTofu and provider lock
        run: |
          tofu fmt -check -recursive infra/tofu
          tofu -chdir=infra/tofu init -backend=false -input=false
          tofu -chdir=infra/tofu validate
          python infra/tofu/verify_provider_lock.py --tofu "$(command -v tofu)"
      - name: Install exact Ansible dependencies
        run: |
          python -m pip install --requirement infra/ansible/requirements.txt
          ansible-galaxy collection install --requirements-file infra/ansible/requirements.yml
      - name: Validate Ansible syntax, lint and policy convergence
        working-directory: infra/ansible
        run: |
          ansible-playbook --syntax-check playbooks/provision.yml \
            --extra-vars @group_vars/all.example.yml --extra-vars @group_vars/secrets.example.yml
          ansible-playbook --syntax-check playbooks/deploy.yml \
            --extra-vars @group_vars/all.example.yml --extra-vars @group_vars/secrets.example.yml \
            --extra-vars release_sha=0123456789abcdef0123456789abcdef01234567
          ansible-lint playbooks
          ANSIBLE_FILTER_PLUGINS="$PWD/filter_plugins" \
            ansible-playbook ../tests/ansible/policy-convergence.yml
          sh ../tests/ansible/verify-delivery-controller.sh

  operations:
    name: Operations and Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Cache the pinned Trivy database
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-0.73.0
      - name: Run operations contract tests
        run: python -m unittest discover -s tests/ops -p 'test_*.py' -v
      - name: Scan filesystem and IaC with pinned Trivy
        run: |
          mkdir -p "$HOME/.cache/trivy" security-reports
          TRIVY_IMAGES="$(
            python3 ops/security/validate_runtime_image_inventory.py \
              --repo-root "$PWD" \
              --inventory ops/security/runtime-image-inventory.json \
              --print-public-images
          )"
          export TRIVY_IMAGES
          TRIVY_CACHE_VOLUME="$HOME/.cache/trivy" \
            TRIVY_SCAN_RUN_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            bash ops/security/scan.sh 2>&1 | tee security-reports/trivy-operations.txt
      - name: Retain security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: security-reports
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish immutable release images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true
    needs: [contracts, backend, frontend, runtime, e2e, infra, operations]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Derive the lower-case GHCR prefix
        id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repository=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          printf 'prefix=ghcr.io/%s\n' "$repository" >>"$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Authenticate to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API
        id: api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/api
          target: api
          push: true
          tags: ${{ steps.registry.outputs.prefix }}-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          sbom: true
          provenance: mode=max
      - name: Build and publish migration
        id: migration
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/api
          target: migration
          push: true
          tags: ${{ steps.registry.outputs.prefix }}-migration:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration
          sbom: true
          provenance: mode=max
      - name: Build and publish web
        id: web
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/web
          target: web
          push: true
          tags: ${{ steps.registry.outputs.prefix }}-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          sbom: true
          provenance: mode=max
      - name: Build and publish backup tools
        id: backup
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ops/backup
          push: true
          tags: ${{ steps.registry.outputs.prefix }}-backup:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
          sbom: true
          provenance: mode=max
      - name: Scan the published immutable digests
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          PREFIX: ${{ steps.registry.outputs.prefix }}
          TRIVY_IMAGES: ${{ steps.registry.outputs.prefix }}-api@${{ steps.api.outputs.digest }} ${{ steps.registry.outputs.prefix }}-migration@${{ steps.migration.outputs.digest }} ${{ steps.registry.outputs.prefix }}-web@${{ steps.web.outputs.digest }} ${{ steps.registry.outputs.prefix }}-backup@${{ steps.backup.outputs.digest }}
          TRIVY_CACHE_VOLUME: alright-mate-ci-trivy-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/delivery/scan-images.sh
      - name: Validate the reviewed migration compatibility declaration
        id: migration_compatibility
        run: bash scripts/delivery/migration-compatibility.sh >>"$GITHUB_OUTPUT"
      - name: Publish the scanned release eligibility manifest
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
          MIGRATION_ROLLBACK_SAFE: ${{ steps.migration_compatibility.outputs.migration_rollback_safe }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          PREFIX: ${{ steps.registry.outputs.prefix }}
        run: |
          docker buildx imagetools create \
            --tag "${PREFIX}-release:${GITHUB_SHA}" \
            --annotation "index:io.alright-mate.release.sha=${GITHUB_SHA}" \
            --annotation "index:io.alright-mate.image.api=${PREFIX}-api@${API_DIGEST}" \
            --annotation "index:io.alright-mate.image.backup=${PREFIX}-backup@${BACKUP_DIGEST}" \
            --annotation "index:io.alright-mate.image.migration=${PREFIX}-migration@${MIGRATION_DIGEST}" \
            --annotation "index:io.alright-mate.image.web=${PREFIX}-web@${WEB_DIGEST}" \
            --annotation "index:io.alright-mate.migration.rollback-safe=${MIGRATION_ROLLBACK_SAFE}" \
            "${PREFIX}-api@${API_DIGEST}"
      - name: Record immutable release references
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          PREFIX: ${{ steps.registry.outputs.prefix }}
        run: |
          {
            printf '### Immutable release `%s`\n\n' "$GITHUB_SHA"
            printf -- '- API: `%s-api@%s`\n' "$PREFIX" "$API_DIGEST"
            printf -- '- Backup tools: `%s-backup@%s`\n' "$PREFIX" "$BACKUP_DIGEST"
            printf -- '- Migration: `%s-migration@%s`\n' "$PREFIX" "$MIGRATION_DIGEST"
            printf -- '- Web: `%s-web@%s`\n' "$PREFIX" "$WEB_DIGEST"
          } >>"$GITHUB_STEP_SUMMARY"
