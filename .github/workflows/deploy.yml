name: Deploy production release

"on":
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact protected-main commit SHA to deploy
        required: true
        type: string
      allow_unsafe_migration_rollback:
        description: Permit image rollback when the reviewed migration declaration is not rollback-safe
        required: true
        default: false
        type: boolean
      unsafe_migration_reason:
        description: Required justification when the unsafe rollback override is enabled
        required: false
        type: string
      operation_id:
        description: Existing 32-character operation ID to reconcile, or leave blank for a new operation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-delivery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy selected immutable release
    if: github.ref == 'refs/heads/main' && github.ref_protected == true
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out protected main delivery code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infra/ansible/requirements.txt
      - name: Set up Buildx for immutable digest resolution
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Install exact deployment dependencies
        run: |
          python -m pip install --requirement infra/ansible/requirements.txt
          ansible-galaxy collection install --requirements-file infra/ansible/requirements.yml
      - name: Derive the lower-case GHCR prefix
        id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repository=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          printf 'prefix=ghcr.io/%s\n' "$repository" >>"$GITHUB_OUTPUT"
      - name: Validate, back up, deploy and smoke-test
        env:
          ALLOW_UNSAFE_MIGRATION_ROLLBACK: ${{ inputs.allow_unsafe_migration_rollback }}
          DELIVERY_OPERATION_ID: ${{ inputs.operation_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          GHCR_REPOSITORY_PREFIX: ${{ steps.registry.outputs.prefix }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_DELIVERY_SSH_USER: ${{ secrets.PRODUCTION_DELIVERY_SSH_USER }}
          PRODUCTION_DELIVERY_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_DELIVERY_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_RUNTIME_ENV: ${{ secrets.PRODUCTION_RUNTIME_ENV }}
          PRODUCTION_GHCR_USERNAME: ${{ secrets.PRODUCTION_GHCR_USERNAME }}
          PRODUCTION_GHCR_TOKEN: ${{ secrets.PRODUCTION_GHCR_TOKEN }}
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          READINESS_TIMEOUT_SECONDS: "120"
          UNSAFE_MIGRATION_REASON: ${{ inputs.unsafe_migration_reason }}
        run: bash scripts/delivery/release.sh deploy "$RELEASE_SHA"
