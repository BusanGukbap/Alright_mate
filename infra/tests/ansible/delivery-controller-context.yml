---
- name: Prove the delivery controller inventory and filters in Ansible
  hosts: alright_mate
  gather_facts: false

  vars:
    expected_release_sha: 0123456789abcdef0123456789abcdef01234567
    inspected_release_images:
      results:
        - item: ghcr.io/example/alright-mate-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          images:
            - Config:
                Labels:
                  org.opencontainers.image.revision: 0123456789abcdef0123456789abcdef01234567

  tasks:
    - name: Require the generated inventory to select exactly its intended host
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all == ['alright-mate']

    - name: Evaluate both deployment filters in the controller context
      ansible.builtin.assert:
        that:
          - "'SERVER_NAME=mate.example.invalid' | runtime_environment_reserved_keys == []"
          - >-
            inspected_release_images
            | release_image_revision_mismatches(expected_release_sha)
            == []
