---
- name: Provision the Alright, Mate? Ubuntu Docker host
  hosts: alright_mate
  become: true
  gather_facts: true

  vars:
    docker_apt_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

  pre_tasks:
    - name: Normalise the restricted operator SSH CIDRs
      ansible.builtin.set_fact:
        operator_ssh_cidrs_normalised: >-
          {{ operator_ssh_cidrs | normalise_operator_ssh_cidrs }}

    - name: Validate the approved host and operator inputs
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version('22.04', '>=')
          - operator_user | length > 0
          - operator_ssh_public_key | length > 0
          - alright_mate_delivery_ssh_public_key | length > 0
          - operator_user != alright_mate_deploy_user
          - operator_ssh_cidrs_normalised | length > 0
        fail_msg: >-
          Provisioning requires Ubuntu LTS, a public key and canonical restricted operator CIDRs.

  tasks:
    - name: Install required host packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
          - unattended-upgrades
          - ufw
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        checksum: sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
        owner: root
        group: root
        mode: "0644"

    - name: Verify the Docker repository signing key fingerprint
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --show-keys
          - --with-colons
          - --fingerprint
          - /etc/apt/keyrings/docker.asc
      register: docker_key_inspection
      changed_when: false
      failed_when: >-
        docker_key_inspection.rc != 0 or
        (docker_key_inspection.stdout | primary_gpg_fingerprints)
        != [docker_apt_key_fingerprint]

    - name: Configure the official Docker Engine repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present

    - name: Create the dedicated deployment group
      ansible.builtin.group:
        name: "{{ alright_mate_deploy_group }}"
        state: present
        system: true

    - name: Create the dedicated unprivileged deployment user
      ansible.builtin.user:
        name: "{{ alright_mate_deploy_user }}"
        group: "{{ alright_mate_deploy_group }}"
        groups: []
        append: false
        create_home: true
        password_lock: true
        shell: /bin/bash
        state: present
        system: true

    - name: Create the backup service group
      ansible.builtin.group:
        name: alright-mate-backup
        state: present
        system: true

    - name: Create the locked backup service account
      ansible.builtin.user:
        name: alright-mate-backup
        group: alright-mate-backup
        groups:
          - "{{ alright_mate_deploy_group }}"
        append: false
        create_home: false
        password_lock: true
        shell: /usr/sbin/nologin
        state: present
        system: true

    - name: Authorise the operator public key before SSH hardening
      ansible.posix.authorized_key:
        user: "{{ operator_user }}"
        key: "{{ operator_ssh_public_key }}"
        state: present
        manage_dir: true

    - name: Authorise the restricted delivery public key
      ansible.posix.authorized_key:
        user: "{{ alright_mate_deploy_user }}"
        key: "{{ alright_mate_delivery_ssh_public_key }}"
        key_options: 'command="/usr/local/libexec/alright-mate-delivery-ssh",restrict'
        state: present
        manage_dir: true
        exclusive: true

    - name: Create the application hierarchy
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: /opt/alright-mate
          owner: root
          group: "{{ alright_mate_deploy_group }}"
          mode: "0755"
        - path: /opt/alright-mate/releases
          owner: "{{ alright_mate_deploy_user }}"
          group: "{{ alright_mate_deploy_group }}"
          mode: "0750"
        - path: /opt/alright-mate/shared
          owner: "{{ alright_mate_deploy_user }}"
          group: "{{ alright_mate_deploy_group }}"
          mode: "0750"
        - path: /opt/alright-mate/ops
          owner: root
          group: "{{ alright_mate_deploy_group }}"
          mode: "0750"
        - path: /etc/alright-mate
          owner: root
          group: alright-mate-backup
          mode: "0750"

    - name: Create the local delivery helper directory
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the versioned delivery helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../scripts/delivery/remote-release.sh"
        dest: /usr/local/libexec/alright-mate-delivery
        owner: root
        group: root
        mode: "0755"

    - name: Install the forced-command delivery SSH boundary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../scripts/delivery/ssh-command.sh"
        dest: /usr/local/libexec/alright-mate-delivery-ssh
        owner: root
        group: root
        mode: "0755"

    - name: Authorise only constrained delivery helper actions
      ansible.builtin.copy:
        dest: /etc/sudoers.d/alright-mate-delivery
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: |
          Cmnd_Alias ALRIGHT_MATE_DELIVERY = \
            /usr/local/libexec/alright-mate-delivery begin-deploy *, \
            /usr/local/libexec/alright-mate-delivery begin-rollback *, \
            /usr/local/libexec/alright-mate-delivery status *, \
            /usr/local/libexec/alright-mate-delivery finish *, \
            /usr/local/libexec/alright-mate-delivery abort *, \
            /usr/local/libexec/alright-mate-delivery verify-runtime *
          {{ alright_mate_deploy_user }} ALL=(root) NOPASSWD: ALRIGHT_MATE_DELIVERY

    - name: Configure bounded Docker log rotation
      ansible.builtin.template:
        src: docker-daemon.json.j2
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      notify: Restart Docker

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Install the SSH hardening drop-in
      ansible.builtin.template:
        src: sshd-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/60-alright-mate.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Ensure UFW enforces IPv6 rules
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^IPV6='
        line: IPV6=yes
        owner: root
        group: root
        mode: "0644"

    - name: Inspect the current UFW rule set
      ansible.builtin.command:
        argv:
          - /usr/sbin/ufw
          - status
          - numbered
      environment:
        LANG: C
        LC_ALL: C
      register: current_ufw_status
      changed_when: false
      check_mode: false

    - name: Determine whether UFW has unmanaged or unsafe rules
      ansible.builtin.set_fact:
        ufw_policy_reset_required: >-
          {{ current_ufw_status.stdout
             | ufw_policy_requires_reset(operator_ssh_cidrs_normalised) }}

    - name: Reset drifted UFW rules before rebuilding the managed policy
      community.general.ufw:
        state: reset
      when: ufw_policy_reset_required

    - name: Deny unsolicited inbound traffic by default
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow outbound traffic by default
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow restricted operator SSH
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "22"
        src: "{{ item }}"
        comment: "alright-mate:ssh:{{ item }}"
      loop: "{{ operator_ssh_cidrs_normalised }}"

    - name: Allow public HTTP
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "80"
        comment: alright-mate:http

    - name: Allow public HTTPS
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "443"
        comment: alright-mate:https

    - name: Enable the host firewall
      community.general.ufw:
        state: enabled

    - name: Enable and start Docker Engine
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

  handlers:
    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
