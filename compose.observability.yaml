services:
  api:
    networks:
      observability:
        aliases:
          - api

  restore-secret-init:
    image: busybox:1.37.0-musl@sha256:fc6dddc4c44b1bfe37f41cae8e67d1693828e8f42a91862816d7953e2c9d3f23
    profiles:
      - restore
    user: 0:0
    entrypoint:
      - /bin/sh
      - -euc
    command:
      - |
        source=/source/age_identity
        destination=/private/age_identity
        test -f "$$source"
        cp "$$source" "$$destination.tmp"
        chmod 0400 "$$destination.tmp"
        chown 10001:10001 "$$destination.tmp"
        mv -f "$$destination.tmp" "$$destination"
        test "$$(stat -c '%u:%g:%a' "$$destination")" = 10001:10001:400
    network_mode: none
    volumes:
      - type: bind
        source: ${AGE_IDENTITY_FILE:-/etc/alright-mate/age-identity.txt}
        target: /source/age_identity
        read_only: true
      - type: volume
        source: restore-secrets
        target: /private
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  backup-metrics-init:
    image: busybox:1.37.0-musl@sha256:fc6dddc4c44b1bfe37f41cae8e67d1693828e8f42a91862816d7953e2c9d3f23
    profiles:
      - observability
      - operations
    user: 0:0
    entrypoint:
      - /bin/sh
      - -euc
    command:
      - |
        chmod 0755 /metrics
        chown 10001:10001 /metrics
        test "$$(stat -c '%u:%g:%a' /metrics)" = 10001:10001:755
    network_mode: none
    volumes:
      - type: volume
        source: backup-metrics
        target: /metrics
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle=false
    expose:
      - "9090"
    networks:
      - observability
    volumes:
      - type: bind
        source: ./ops/monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./ops/monitoring/prometheus/rules
        target: /etc/prometheus/rules
        read_only: true
      - type: volume
        source: prometheus-data
        target: /prometheus
    tmpfs:
      - /tmp:size=16m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles:
      - observability
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
      - --collector.textfile.directory=/textfile
    expose:
      - "9100"
    networks:
      - observability
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      - type: volume
        source: backup-metrics
        target: /textfile
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      backup-metrics-init:
        condition: service_completed_successfully

  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    profiles:
      - backup-test
    user: 10001:10001
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:-}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-alright-mate-backups}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
    expose:
      - "3900"
    networks:
      - backup
    volumes:
      - type: bind
        source: ./ops/backup/garage.toml
        target: /etc/garage.toml
        read_only: true
    tmpfs:
      - /var/lib/garage:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /garage
        - status
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  backup:
    image: ${BACKUP_TOOLS_IMAGE:-alright-mate/backup-tools:local}
    build:
      context: ./ops/backup
      dockerfile: Dockerfile
    profiles:
      - operations
    entrypoint:
      - /usr/local/bin/backup.sh
    environment:
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      BACKUP_METRICS_DIR: /metrics
      DATABASE_URL: ${DATABASE_URL:-postgres://alrightmate:local-development-only@db:5432/alrightmate?sslmode=disable}
      RELEASE_SHA: ${RELEASE_SHA:-}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-alright-mate-backups}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    networks:
      - backend
      - backup
      - backup-egress
    volumes:
      - type: volume
        source: backup-metrics
        target: /metrics
    tmpfs:
      - /work:size=1024m,mode=0700,uid=10001,gid=10001
      - /tmp:size=16m,mode=1777
      - /home/ops:size=4m,mode=0700,uid=10001,gid=10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      backup-metrics-init:
        condition: service_completed_successfully

  restore-drill:
    image: ${BACKUP_TOOLS_IMAGE:-alright-mate/backup-tools:local}
    build:
      context: ./ops/backup
      dockerfile: Dockerfile
    profiles:
      - restore
    entrypoint:
      - /usr/local/bin/restore-drill.sh
    environment:
      AGE_IDENTITY_FILE: /run/private/age_identity
      RESTORE_NETWORK: ${RESTORE_NETWORK:-alright-mate_backend}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-alright-mate-backups}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    group_add:
      - ${DOCKER_GID:-999}
    networks:
      - backup
      - backup-egress
      - backend
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: volume
        source: restore-secrets
        target: /run/private
        read_only: true
    tmpfs:
      - /work:size=1024m,mode=0700,uid=10001,gid=10001
      - /tmp:size=16m,mode=1777
      - /home/ops:size=4m,mode=0700,uid=10001,gid=10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      restore-secret-init:
        condition: service_completed_successfully

networks:
  observability:
    internal: true
  backup:
    internal: true
  backup-egress:

volumes:
  prometheus-data:
  restore-secrets:
  backup-metrics:
