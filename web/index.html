<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alright, Mate?</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf6ed;
      --ink: #28231f;
      --muted: #554c45;
      --rule: #d9cfc1;
      --accent: #7c223c;
      --serif: Georgia, "Times New Roman", serif;
      font-family: system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    main {
      width: min(62rem, 100% - clamp(2rem, 9vw, 7rem));
      margin-inline: auto;
      padding-block: clamp(2rem, 7vw, 5.25rem) 3rem;
    }

    h1, h2, dt { font-family: var(--serif); }

    h1 {
      margin: 0 0 clamp(1.5rem, 4vw, 2.5rem);
      padding-bottom: .35em;
      border-bottom: .1875rem solid var(--accent);
      font-size: clamp(2.3rem, 6vw, 4rem);
      line-height: 1.05;
      letter-spacing: -.05em;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
      grid-template-areas: "saved add";
      gap: clamp(1.5rem, 3vw, 2.5rem);
      align-items: start;
    }

    .add {
      grid-area: add;
      padding-inline-start: clamp(1.5rem, 3vw, 2.5rem);
      border-inline-start: 1px solid var(--rule);
    }

    .saved { grid-area: saved; }

    h2 {
      margin: 0 0 1.25rem;
      font-size: clamp(1.6rem, 3vw, 2.125rem);
      line-height: 1.15;
      letter-spacing: -.025em;
    }

    fieldset {
      display: grid;
      gap: 1rem;
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    label { display: grid; gap: .4rem; font-size: .9375rem; font-weight: 650; }

    input, textarea, button {
      min-block-size: 2.75rem;
      border-radius: .125rem;
      font: inherit;
    }

    input, textarea {
      width: 100%;
      padding: .625rem .75rem;
      color: inherit;
      background: #fffcf6;
      border: 1px solid #8a7e72;
      font-weight: 400;
    }

    textarea { resize: vertical; }

    button {
      justify-self: start;
      padding: .625rem 1rem;
      color: #fff;
      background: var(--accent);
      border: 1px solid transparent;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:enabled { background: #62172e; }
    button:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    [role="status"] { margin: .85rem 0 0; color: var(--muted); }
    [role="status"]:empty { margin: 0; }

    dl { margin: 0; }
    dl > div { padding-block: 1rem; }
    dl > div:first-child { padding-block-start: 0; }
    dl > div + div { border-block-start: 1px solid var(--rule); }

    dt, dd { overflow-wrap: anywhere; }
    dt { font-size: 1.4rem; font-weight: 700; line-height: 1.2; }
    dd { margin: .3rem 0 0; color: var(--muted); line-height: 1.5; white-space: pre-wrap; }

    @media (max-width: 45rem) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "add" "saved";
      }

      .add { padding: 0 0 1.5rem; border: 0; border-block-end: 1px solid var(--rule); }
    }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Alright, Mate?</h1>
    <noscript><p>Enable JavaScript to load and save your expressions.</p></noscript>
    <div class="layout">
      <section class="add" aria-labelledby="add-heading">
        <h2 id="add-heading">Add an expression</h2>
        <form id="expression-form" method="post">
          <fieldset id="expression-fields" disabled>
            <label for="phrase">
              Expression
              <input id="phrase" name="phrase" maxlength="120" required>
            </label>
            <label for="meaning">
              Meaning
              <textarea id="meaning" name="meaning" rows="3" maxlength="500" required></textarea>
            </label>
            <button type="submit">Save expression</button>
          </fieldset>
          <p id="save-status" role="status"></p>
        </form>
      </section>
      <section class="saved" aria-labelledby="saved-heading">
        <h2 id="saved-heading">Saved expressions</h2>
        <p id="list-status" role="status"></p>
        <dl id="expression-list"></dl>
      </section>
    </div>
  </main>
</body>
</html>
