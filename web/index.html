<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alright, Mate?</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #253532;
      background: #f5f3eb;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    main {
      width: min(66rem, 100% - 2rem);
      margin: auto;
      padding: clamp(2rem, 7vw, 5rem) 0 3rem;
    }

    h1 {
      margin: 0 0 clamp(1.5rem, 4vw, 2.5rem);
      font: 600 clamp(2.65rem, 8vw, 4.75rem)/1.06 Georgia, serif;
      letter-spacing: -.045em;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
      align-items: start;
      gap: 1rem;
    }

    section {
      padding: clamp(1rem, 3vw, 1.75rem);
      background: #fffdfa;
      border: 1px solid #d5dcd3;
      border-radius: .75rem;
    }

    h2 { margin: 0 0 1.25rem; font-size: 1.2rem; }

    fieldset {
      display: grid;
      gap: 1rem;
      min-inline-size: 0;
      margin: 0;
      border: 0;
      padding: 0;
    }

    label { display: grid; gap: .4rem; font-weight: 600; }

    input, textarea, button {
      font: inherit;
      border-radius: .4rem;
    }

    input, textarea {
      width: 100%;
      padding: .65rem .75rem;
      color: inherit;
      background: white;
      border: 1px solid #8a9a92;
    }

    textarea { resize: vertical; }

    button {
      justify-self: start;
      padding: .65rem 1rem;
      color: white;
      background: #285748;
      border: 1px solid transparent;
      cursor: pointer;
    }

    button:hover:enabled { background: #1d4337; }
    button:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 2px solid #25574a; outline-offset: 3px; }

    [role="status"] { margin: .85rem 0 0; color: #4e6259; }
    [role="status"]:empty { margin: 0; }

    dl { margin: 0; }
    dl > div { padding: .9rem 0; border-top: 1px solid #d5dcd3; }
    dl > div:last-child { padding-bottom: 0; }
    dt, dd { overflow-wrap: anywhere; }
    dt { font-weight: 700; }
    dd { margin: .3rem 0 0; white-space: pre-wrap; }

    @media (max-width: 45rem) {
      .layout { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Alright, Mate?</h1>
    <noscript><p>Enable JavaScript to load and save your expressions.</p></noscript>
    <div class="layout">
      <section aria-labelledby="add-heading">
        <h2 id="add-heading">Add an expression</h2>
        <form id="expression-form" method="post">
          <fieldset id="expression-fields" disabled>
            <label for="phrase">
              Expression
              <input id="phrase" name="phrase" maxlength="120" required>
            </label>
            <label for="meaning">
              Meaning
              <textarea id="meaning" name="meaning" rows="3" maxlength="500" required></textarea>
            </label>
            <button type="submit">Save expression</button>
          </fieldset>
          <p id="save-status" role="status"></p>
        </form>
      </section>
      <section aria-labelledby="saved-heading">
        <h2 id="saved-heading">Saved expressions</h2>
        <p id="list-status" role="status"></p>
        <dl id="expression-list"></dl>
      </section>
    </div>
  </main>
</body>
</html>
