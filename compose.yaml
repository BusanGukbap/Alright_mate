name: ${COMPOSE_PROJECT_NAME:-alright-mate}

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-read-only-service: &read-only-service
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges=true
  logging: *bounded-logging

services:
  db:
    image: cgr.dev/chainguard/postgres:latest@sha256:e67e686bf76586ff0b87fd42553f2dce5e461cb76e090f502ab129aaef141f12
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:-alrightmate}
      POSTGRES_USER: ${POSTGRES_USER:-alrightmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges=true
    logging: *bounded-logging

  migrate:
    <<: *read-only-service
    image: alright-mate-migration:${IMAGE_TAG:-local}
    build:
      context: ./apps/api
      target: migration
      args:
        BUILD_VERSION: ${BUILD_VERSION:-development}
        VCS_REF: ${VCS_REF:-unknown}
    restart: "no"
    environment:
      GOOSE_DBSTRING: ${DATABASE_URL:-postgres://alrightmate:local-development-only@db:5432/alrightmate?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777

  api:
    <<: *read-only-service
    image: alright-mate-api:${IMAGE_TAG:-local}
    build:
      context: ./apps/api
      target: api
      args:
        BUILD_VERSION: ${BUILD_VERSION:-development}
        VCS_REF: ${VCS_REF:-unknown}
    restart: unless-stopped
    environment:
      API_LISTEN_ADDRESS: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://alrightmate:local-development-only@db:5432/alrightmate?sslmode=disable}
      OWNER_GITHUB_LOGIN: ${OWNER_GITHUB_LOGIN:-local-owner}
      TRUSTED_OWNER_HEADER: X-Alright-Mate-Owner
      BUILD_VERSION: ${BUILD_VERSION:-development}
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
        restart: false
    networks:
      - api_gateway
      - backend
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  web:
    <<: *read-only-service
    image: alright-mate-web:${IMAGE_TAG:-local}
    build:
      context: ./apps/web
      args:
        BUILD_VERSION: ${BUILD_VERSION:-development}
        VCS_REF: ${VCS_REF:-unknown}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - web_gateway
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/index.html
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  gateway:
    <<: *read-only-service
    image: nginx:1.30.4-alpine3.24-slim@sha256:ddde39c6e51f02fde7410c2e9c234cf2d0a4c7bdbbe176aeb37d8ad7ab4eb58c
    restart: unless-stopped
    user: 101:101
    environment:
      NGINX_ENVSUBST_FILTER: ^SERVER_NAME$
      SERVER_NAME: ${SERVER_NAME:-localhost}
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ./deploy/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ./deploy/nginx/snippets
        target: /etc/nginx/snippets
        read_only: true
    depends_on:
      api:
        condition: service_healthy
        restart: true
      web:
        condition: service_healthy
        restart: true
    networks:
      - edge
      - api_gateway
      - web_gateway
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

networks:
  edge:
    driver: bridge
  api_gateway:
    driver: bridge
    internal: true
  web_gateway:
    driver: bridge
    internal: true
  backend:
    driver: bridge
    internal: true

volumes:
  postgres-data:
