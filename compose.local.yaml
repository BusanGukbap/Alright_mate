services:
  gateway:
    ports:
      - name: http
        target: 8080
        published: ${APP_HTTP_PORT:-8080}
        protocol: tcp
        app_protocol: http
        mode: host
    volumes:
      - type: bind
        source: ./deploy/nginx/local.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
